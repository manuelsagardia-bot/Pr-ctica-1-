<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="Club de Pádel Moncloa">
  <title>Club de Pádel Moncloa</title>

  <!-- ============ ESCUDO ============ -->
  <g>
    <circle cx="110" cy="110" r="95" fill="#0E2A3B"/>
    <circle cx="110" cy="110" r="83" fill="none" stroke="#C8F250" stroke-width="3"/>

    <!-- Pala de pádel -->
    <g transform="translate(104,104) rotate(-18) scale(0.58)">
      <!-- Mango -->
      <rect x="-14" y="58" width="28" height="100" rx="13" fill="#C8F250"/>
      <g stroke="#0E2A3B" stroke-width="4" stroke-linecap="round">
        <line x1="-9" y1="88" x2="9" y2="88"/>
        <line x1="-9" y1="104" x2="9" y2="104"/>
        <line x1="-9" y1="120" x2="9" y2="120"/>
      </g>
      <!-- Cabeza -->
      <path d="M0,-96 C42,-96 68,-58 68,-14 C68,32 38,66 0,66 C-38,66 -68,32 -68,-14 C-68,-58 -42,-96 0,-96 Z"
            fill="#C8F250"/>
      <!-- Agujeros -->
      <g fill="#0E2A3B">
        <circle cx="-36" cy="-58" r="9"/><circle cx="-12" cy="-58" r="9"/>
        <circle cx="12"  cy="-58" r="9"/><circle cx="36"  cy="-58" r="9"/>
        <circle cx="-48" cy="-28" r="9"/><circle cx="-24" cy="-28" r="9"/>
        <circle cx="0"   cy="-28" r="9"/><circle cx="24"  cy="-28" r="9"/>
        <circle cx="48"  cy="-28" r="9"/>
        <circle cx="-48" cy="2"   r="9"/><circle cx="-24" cy="2"   r="9"/>
        <circle cx="0"   cy="2"   r="9"/><circle cx="24"  cy="2"   r="9"/>
        <circle cx="48"  cy="2"   r="9"/>
        <circle cx="-36" cy="32"  r="9"/><circle cx="-12" cy="32"  r="9"/>
        <circle cx="12"  cy="32"  r="9"/><circle cx="36"  cy="32"  r="9"/>
      </g>
    </g>

    <!-- Pelota -->
    <circle cx="150" cy="152" r="18" fill="#FFFFFF"/>
    <path d="M150,134 A 22 22 0 0 1 150,170" fill="none" stroke="#0E2A3B" stroke-width="2.5"/>
    <path d="M150,134 A 22 22 0 0 0 150,170" fill="none" stroke="#0E2A3B" stroke-width="2.5"/>
  </g>

  <!-- ============ TEXTO ============ -->
  <g font-family="'Segoe UI', Arial, Helvetica, sans-serif">
    <text x="242" y="102" font-size="60" font-weight="800" fill="#0E2A3B" letter-spacing="1">MONCLOA</text>
    <rect x="244" y="120" width="54" height="5" rx="2.5" fill="#C8F250"/>
    <text x="244" y="152" font-size="21" font-weight="600" fill="#0E2A3B" letter-spacing="5.5">CLUB DE PÁDEL</text>
    <text x="246" y="180" font-size="14" font-weight="500" fill="#6B8494" letter-spacing="3.5">MADRID</text>
  </g>
</svg>
